<html>
<head>
<title>Love Page</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    text-align: center;
    width: 340px;
    padding: 20px;
    position: relative;
}

.main-img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 15px;
}

.stitch {
    position: absolute;
    bottom: 5px;
    right: 5px;
    width: 80px;
    pointer-events: none;
    animation: float 2s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0); }
}

button {
    padding: 10px 20px;
    margin: 8px;
    border-radius: 6px;
    border: 1px solid black;
    background: white;
    cursor: pointer;
}

.yes {
    background: black;
    color: white;
}
</style>
</head>

<body>

<div class="box">
    <img src="images/stitch.png" class="stitch">
    <img src="images/img8.jpg" class="main-img">

    <h2>
Last chance<br>
Choose love<br>
Choose peace<br>
Choose yes<br>
Choose me..
</h2>

<button class="yes" onclick="location.href='yes.html'">Yes</button>
<button onclick="location.href='yes.html'">No</button>

<img src="images/img8.jpg" class="main-img">

</body>
</html>
